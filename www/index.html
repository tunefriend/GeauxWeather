<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0f14" />
  <title>PureSky</title>
  <link rel="stylesheet" href="css/app.css" />
  <!-- Leaflet (CDN for preview; vendor into www/lib for offline builds) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="location-row">
        <button id="btn-loc" class="icon-btn" aria-label="Search location">📍</button>
        <h1 id="loc-name" class="loc-name">—</h1>
        <button id="btn-refresh" class="icon-btn" aria-label="Refresh">↻</button>
      </div>
      <div id="status" class="status"></div>
    </header>

    <!-- Screens -->
    <main id="screens">
      <!-- Today -->
      <section id="screen-today" class="screen active">
        <div class="current">
          <div id="temp-now" class="temp-now">—°</div>
          <div id="cond-now" class="cond-now">—</div>
          <div id="feels" class="feels">Feels —°</div>
        </div>
        <div class="metrics" id="metrics-today"></div>
        <div class="hourly-wrap">
          <h2 class="section-title">Hourly</h2>
          <div id="hourly" class="hourly"></div>
        </div>
      </section>

      <!-- 10-Day -->
      <section id="screen-10day" class="screen">
        <h2 class="section-title">10-Day Forecast</h2>
        <div id="daily" class="daily"></div>
      </section>

      <!-- Maps -->
      <section id="screen-maps" class="screen screen-maps">
        <div class="map-toolbar">
          <button class="layer-btn active" data-layer="radar">Rain</button>
          <button class="layer-btn" data-layer="wind">Wind</button>
          <button class="layer-btn" data-layer="fog">Fog</button>
          <button type="button" id="map-recenter" class="layer-btn map-tool-btn" title="Recenter">⊙</button>
        </div>
        <div id="map" class="map-container"></div>
        <div class="map-pin-bar">
          <span id="map-pin-hint" class="map-pin-hint">Tap map to drop a pin</span>
          <button type="button" id="btn-save-place" class="save-place-btn" disabled>Save</button>
        </div>
        <div id="radar-controls" class="radar-controls">
          <button type="button" id="radar-prev" class="radar-btn" aria-label="Previous">‹</button>
          <button type="button" id="radar-play" class="radar-btn play" aria-label="Play">▶</button>
          <button type="button" id="radar-next" class="radar-btn" aria-label="Next">›</button>
          <input type="range" id="radar-slider" class="radar-slider" min="0" max="0" value="0" />
          <span id="radar-time" class="radar-time">—</span>
        </div>
        <div id="map-info" class="map-info hidden"></div>
        <div class="map-legend muted small" id="map-legend">Tap map to pin · RainViewer</div>
      </section>

      <!-- Places (saved locations) -->
      <section id="screen-places" class="screen screen-places">
        <div class="places-header">
          <h2 class="section-title places-title">Locations</h2>
          <button type="button" id="btn-add-place" class="add-place-btn" aria-label="Add location">+</button>
        </div>
        <p class="places-hint muted small">Tap to open · Hold to set default</p>
        <div id="places-list" class="places-list"></div>
      </section>

      <!-- Settings -->
      <section id="screen-settings" class="screen">
        <h2 class="section-title">Settings</h2>
        <div class="settings-group">
          <label class="setting-row">
            <span>Units</span>
            <select id="units">
              <option value="imperial">°F · mph</option>
              <option value="metric">°C · km/h</option>
            </select>
          </label>
          <label class="setting-row">
            <span>Theme</span>
            <span class="muted">Dark (fixed)</span>
          </label>
        </div>
        <div class="settings-group">
          <p class="muted small">PureSky · GPL-3.0 · Open-Meteo data · No tracking</p>
        </div>
      </section>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="today">
        <span class="nav-icon">☀</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-btn" data-screen="10day">
        <span class="nav-icon">📅</span>
        <span class="nav-label">10-Day</span>
      </button>
      <button class="nav-btn" data-screen="maps">
        <span class="nav-icon">🗺</span>
        <span class="nav-label">Maps</span>
      </button>
      <button class="nav-btn" data-screen="places">
        <span class="nav-icon nav-icon-img"><img src="assets/gps-pin.svg" alt="" width="22" height="22" /></span>
        <span class="nav-label">Places</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <span class="nav-icon">⚙</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Search overlay (add location) -->
  <div id="search-overlay" class="overlay hidden">
    <div class="overlay-inner">
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="City or place…" autocomplete="off" />
        <button id="search-close" class="icon-btn">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
      <button id="btn-use-gps" class="gps-btn">Use current location (set home)</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/location.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
